<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<link rel="icon" href="/favicon-32.png" sizes="32x32"/>
<!-- Home-screen icon. iOS composites a TRANSPARENT apple-touch-icon onto black,
     so this one has the brand background baked in (tools/make-icons.mjs). The
     chat is explicitly pause-and-resume-later, so clients DO save it. -->
<link rel="apple-touch-icon" href="/apple-touch-icon.png"/>
<!-- Short label under the home-screen icon; without it iOS uses the <title>,
     which is personalised per client and far too long to render. -->
<meta name="apple-mobile-web-app-title" content="Lumen"/>
<!-- Initial value only: the app rewrites this when the client toggles dark mode. -->
<meta name="theme-color" content="#F7F7FA"/>
<link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin/>
<!-- Inter, served from this site rather than Google's font CDN.
     WHY: every client's browser used to make two extra calls to Google before the
     page could paint, handing Google their IP address. The one advantage that
     used to justify that (a shared cross-site font cache) disappeared when
     browsers partitioned their HTTP cache in 2020, so it bought nothing.
     These are the exact woff2 files Google served, with Google's own
     unicode-range split preserved: a typical client downloads only the 47 KB
     latin file, and latin-ext (85 KB) is fetched ONLY if a page actually renders
     Polish/Turkish/Czech characters — e.g. a client's brand name.
     One @font-face per subset covers every weight because these are VARIABLE
     fonts (verified by measuring 400/600/700/800 render distinctly), so the
     wordmark's 800 costs nothing extra.
     Licence: SIL OFL 1.1, see /fonts/OFL.txt. Regenerate with tools/get-fonts.sh. -->
<style>
  @font-face {
    font-family: 'Inter'; font-style: normal; font-weight: 100 900; font-display: swap;
    src: url('/fonts/inter-latin.woff2') format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  @font-face {
    font-family: 'Inter'; font-style: normal; font-weight: 100 900; font-display: swap;
    src: url('/fonts/inter-latin-ext.woff2') format('woff2');
    unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
  }
</style>
<title>Lumen Onboarding</title>
<style>
  #boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#fff;font-family:'Inter',Arial,sans-serif}
  #boot .orb{width:64px;height:64px;border-radius:18px;background:#7E48EC;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(126,72,236,.25)}
  #boot .lbl{color:#64748b;font-size:13px;animation:bootpulse 1.4s ease-in-out infinite}
  @keyframes bootpulse{0%,100%{opacity:.55}50%{opacity:1}}
  @media (prefers-reduced-motion: reduce){#boot .lbl{animation:none}}
</style>
</head>
<body style="margin:0">
<!-- Splash lives inside #root; React replaces it on first commit, so there is no
     blank-white beat while the bundle loads on a slow client connection. -->
<div id="root"><div id="boot"><div style="width:56px;height:56px;border-radius:50%;background:#EDE7FB;display:flex;align-items:center;justify-content:center"><img src="/lumen-mark.png" width="34" height="34" alt=""/></div><div class="lbl">Loading your session…</div></div></div>
<script type="module" src="/chat-main.js"></script>
</body>
</html>
