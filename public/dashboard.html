<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="robots" content="noindex, nofollow"/>
<link rel="icon" href="/favicon-32.png" sizes="32x32"/>
<title>Lumen Onboarding — Proserv Dashboard</title>
<!-- INTERNAL PAGE: session reads require DASHBOARD_TOKEN, but the page itself is
     ungated. Gate behind Netlify password protection or Identity before production.
     noindex is a hint to crawlers, not access control. -->
<!-- Inter, served from this site rather than Google's font CDN.
     WHY: every client's browser used to make two extra calls to Google before the
     page could paint, handing Google their IP address. The one advantage that
     used to justify that (a shared cross-site font cache) disappeared when
     browsers partitioned their HTTP cache in 2020, so it bought nothing.
     These are the exact woff2 files Google served, with Google's own
     unicode-range split preserved: a typical client downloads only the 47 KB
     latin file, and latin-ext (85 KB) is fetched ONLY if a page actually renders
     Polish/Turkish/Czech characters — e.g. a client's brand name.
     One @font-face per subset covers every weight because these are VARIABLE
     fonts (verified by measuring 400/600/700/800 render distinctly), so the
     wordmark's 800 costs nothing extra.
     Licence: SIL OFL 1.1, see /fonts/OFL.txt. Regenerate with tools/get-fonts.sh. -->
<style>
  @font-face {
    font-family: 'Inter'; font-style: normal; font-weight: 100 900; font-display: swap;
    src: url('/fonts/inter-latin.woff2') format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  @font-face {
    font-family: 'Inter'; font-style: normal; font-weight: 100 900; font-display: swap;
    src: url('/fonts/inter-latin-ext.woff2') format('woff2');
    unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
  }
</style>
<style>
  :root {
    /* Mirror the client chat (Inter + Lumen purple + waveform mark) so the
       dashboard, sales page and chat read as one product. --teal/--muted/
       --cherry/--mint are kept (the script references them by name in inline
       styles). Design tokens match the T object in lumen.jsx. */
    --purple:#7C3AED; --purple-soft:#EDE7FB;
    --teal:#012B3A; --ink:#0f172a; --cherry:#e11d48; --mint:#DFFFDE;
    /* --muted was #64748b, which measures 4.39:1 on --bg — just under the 4.5:1
       WCAG AA floor, and it carries the footnote and every filter label. Darkened
       to clear the bar on both surfaces (4.72:1 on --bg, 5.11:1 on white). */
    --border:#e6e8ee; --muted:#5f6f86; --bg:#f6f5fb;
    --radius-sm:6px; --radius-md:10px; --radius-lg:16px;
    --shadow-raise:0 1px 3px rgba(15,23,42,.06); --shadow-float:0 8px 24px rgba(0,0,0,.12); --shadow-modal:0 16px 48px rgba(0,0,0,.2);
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:'Inter',Arial,Helvetica,sans-serif; color:var(--ink); background:var(--bg); }

  /* Branded header (matches sales + chat). */
  .bar { background:#fff; border-bottom:1px solid var(--border); padding:12px 24px; display:flex; align-items:center; gap:12px; }
  .mark { width:34px; height:34px; border-radius:50%; background:var(--purple-soft); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .mark img { width:20px; height:20px; display:block; }
  .brand b { font-size:15px; color:var(--purple); letter-spacing:-.01em; }
  .brand .by { font-size:10px; color:var(--muted); }
  .barlabel { font-size:12px; color:var(--muted); border-left:1px solid var(--border); padding-left:12px; }
  .baractions { margin-left:auto; display:flex; align-items:center; gap:12px; }
  .count { font-size:13px; color:var(--muted); }
  .updated { font-size:11px; color:var(--muted); }
  .refresh { background:var(--purple-soft); color:var(--purple); border:none; border-radius:8px; padding:8px 15px; cursor:pointer; font-family:inherit; font-size:12px; font-weight:700; }
  .refresh:disabled { opacity:.6; cursor:default; }

  .wrap { max-width:1400px; margin:26px auto; padding:0 20px; }
  h1 { font-size:20px; margin:0 0 16px; color:var(--teal); letter-spacing:-.01em; }
  table { width:100%; border-collapse:collapse; background:#fff; border:1px solid var(--border); border-radius:14px; overflow:hidden; box-shadow:var(--shadow-raise); }
  th, td { text-align:left; padding:12px 14px; font-size:13px; border-bottom:1px solid var(--border); }
  th { background:#faf9fe; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); font-weight:700; }
  tr:last-child td { border-bottom:none; }
  tr.row { cursor:pointer; }
  tr.row:hover { background:#faf9fe; }
  .pill { display:inline-block; padding:3px 10px; border-radius:20px; font-size:11px; font-weight:700; }
  .pill.completed { background:var(--mint); color:#0a5c2a; }
  .pill.other { background:#eef1f5; color:var(--muted); }
  .muted { color:var(--muted); }
  .empty, .err { text-align:center; padding:40px; color:var(--muted); font-size:14px; }
  .err { color:var(--cherry); }
  .kpis { display:grid; grid-template-columns:repeat(auto-fit, minmax(170px,1fr)); gap:12px; margin-bottom:18px; }
  .kpi { background:#fff; border:1px solid var(--border); border-radius:14px; padding:15px 16px; box-shadow:var(--shadow-raise); }
  .kpi .v { font-size:23px; font-weight:800; color:var(--teal); font-variant-numeric:tabular-nums; letter-spacing:-.02em; }
  .kpi .l { font-size:10.5px; color:var(--muted); margin-top:4px; line-height:1.4; }
  td.num { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
  th.num { text-align:right; }
  .sub2 { font-size:10.5px; color:var(--muted); }
  .chip { display:inline-block; margin-left:6px; padding:1px 8px; border-radius:20px; font-size:9.5px; font-weight:700; background:var(--purple-soft); color:var(--purple); vertical-align:middle; }
  .rep a { color:#0b6b3a; font-weight:700; text-decoration:underline; font-size:12px; }
  .rep .ho { font-size:11px; color:var(--muted); }
  /* Standalone "handoff ready" (no Sheet yet): the row opens the detail, so make
     it read as an action, not a dead label. */
  .rep .hoff { color:var(--purple); font-weight:700; text-decoration:underline; font-size:12px; cursor:pointer; }
  tr.row:hover .rep .hoff { text-decoration:none; }
  .rep .none { color:var(--muted); }
  .copylink { background:var(--purple-soft); color:var(--purple); border:none; border-radius:7px; padding:4px 10px; font-size:11px; font-weight:700; cursor:pointer; font-family:inherit; white-space:nowrap; }
  .remind { background:#fff; color:var(--teal); border:1px solid #c3ccd6; border-radius:7px; padding:4px 10px; font-size:11px; font-weight:700; cursor:pointer; font-family:inherit; white-space:nowrap; }
  .chase { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
  .chase .copylink, .chase .remind { padding:7px 13px; font-size:12px; }
  .remind:hover { border-color:var(--purple); color:var(--purple); }
  .note { font-size:11px; color:var(--muted); margin:14px 2px 0; line-height:1.5; }
  .filters { display:flex; gap:14px; align-items:center; margin-bottom:14px; flex-wrap:wrap; }
  .filters label { font-size:12px; color:var(--muted); display:flex; align-items:center; gap:6px; }
  .filters select { font-family:inherit; font-size:13px; padding:7px 10px; border:1px solid var(--border); border-radius:9px; background:#fff; color:var(--ink); cursor:pointer; outline:none; }
  .filters input[type="search"] { font-family:inherit; font-size:13px; padding:8px 12px; border:1px solid var(--border); border-radius:9px; color:var(--ink); min-width:240px; outline:none; background:#fff; }
  .filters input[type="search"]:focus, .filters select:focus { border-color:var(--purple); box-shadow:0 0 0 3px rgba(124,58,237,.12); }
  .filters input[type="date"] { font-family:inherit; font-size:13px; padding:6px 10px; border:1px solid var(--border); border-radius:9px; background:#fff; color:var(--ink); cursor:pointer; outline:none; }
  .filters input[type="date"]:focus { border-color:var(--purple); box-shadow:0 0 0 3px rgba(124,58,237,.12); }
  /* The filter bar uses THREE shapes, one per job, so a consultant can tell at a
     glance what a control will do before clicking it. Everything used to be a
     white pill: status values, the disclosure and the reset button were
     indistinguishable, while the two controls that DO the same job (status pills
     and "Show archived") looked nothing alike.
       fully-round pill  = a filter VALUE you toggle   (.spill)
       rounded rect      = a disclosure or a scope switch (.fmore, .farch)
       right-hand button = an ACTION that does something (.fclear, .fexport)
     Actions are pushed to the right edge inside .factions so they never sit in
     the same visual run as the values they act on. */
  .factions { margin-left:auto; display:flex; align-items:center; gap:10px; }
  .fexport { background:var(--purple); color:#fff; border:none; border-radius:9px; padding:8px 14px; font-size:12px; font-weight:700; cursor:pointer; font-family:inherit; display:inline-flex; align-items:center; gap:6px; }
  .fexport:hover { background:#6d28d9; }
  .fexport:focus-visible { outline:2px solid var(--purple); outline-offset:2px; }
  /* Archive / delete controls. The selection column is narrow and centred so it reads
     as a gutter rather than a data column. */
  /* "Show archived" is NOT a status value — it swaps the endpoint (?archived=1),
     i.e. it changes which records exist, not which of them pass a filter. So it
     deliberately does not wear the round status pill: it is a scope switch, and
     styling it as a peer of "Completed" would invite reading it as one. It was a
     bare checkbox, the only one in the bar, which under-sold it just as badly. */
  .farch { background:#fff; border:1px solid var(--border); border-radius:9px; padding:7px 13px; font-size:12px; font-weight:700; cursor:pointer; font-family:inherit; color:var(--teal); display:inline-flex; align-items:center; gap:7px; }
  .farch:hover { border-color:var(--purple); color:var(--purple); }
  .farch[aria-pressed="true"] { background:var(--purple-soft); border-color:var(--purple); color:var(--purple); }
  .farch:focus-visible { outline:2px solid var(--purple); outline-offset:2px; }
  .farch .fdot { width:7px; height:7px; border-radius:50%; background:#c3ccd6; flex:none; }
  .farch[aria-pressed="true"] .fdot { background:var(--purple); }
  .selcol { width:34px; text-align:center; padding-left:10px; padding-right:0; }
  .selcol input { cursor:pointer; }
  /* Sticky, because clearing test rows means scrolling down and ticking a run of them.
     Rendered in flow above the table, the bar was ~1300px off-screen by the time you
     reached the rows you wanted, so ticking a box produced no visible feedback and the
     Archive button was nowhere on screen. The slot (not the bar) is the sticky element:
     its parent #body spans the whole table, whereas the bar's own box does not, and a
     sticky element cannot travel outside its parent. */
  #bulkSlot { position:sticky; top:0; z-index:5; }
  #bulkSlot:not(:empty) { background:var(--bg); padding-top:4px; }
  .bulkbar { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:10px; padding:9px 13px;
             background:var(--purple-soft); border:1px solid var(--border); border-radius:10px; font-size:12px; font-weight:600; color:var(--purple); }
  .bulkbtn { background:#fff; color:var(--purple); border:1px solid var(--border); border-radius:8px; padding:6px 12px;
             font-size:12px; font-weight:700; cursor:pointer; font-family:inherit; }
  /* Permanent deletion is the one irreversible action here, so it is the only control
     in the dashboard that reads as destructive. */
  .bulkbtn.danger { color:#b42318; border-color:#fecaca; background:#fff5f5; }
  .bulkbtn.ghost { color:var(--muted); font-weight:600; }
  /* Status is a multi-select: toggle pills rather than a dropdown, so picking two
     (e.g. stalled + link sent) is two clicks and the active set is always visible. */
  .fstatus { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .fslabel { font-size:12px; color:var(--muted); margin-right:2px; }
  .spill { background:#fff; color:var(--teal); border:1px solid var(--border); border-radius:999px; padding:6px 12px; font-size:12px; font-weight:600; cursor:pointer; font-family:inherit; white-space:nowrap; }
  .spill:hover { border-color:var(--purple); color:var(--purple); }
  .spill.on { background:var(--purple); border-color:var(--purple); color:#fff; font-weight:700; }
  .spill:focus-visible { outline:2px solid var(--purple); outline-offset:2px; }
  /* Sorting is a real button inside the th, not a click handler on the th itself.
     A bare <th onclick> is unreachable by keyboard and invisible to assistive tech;
     the th keeps aria-sort so the current sort is announced. */
  th.sortable { user-select:none; white-space:nowrap; padding:0; }
  .sortbtn { background:none; border:none; cursor:pointer; font:inherit; color:inherit;
             text-transform:inherit; letter-spacing:inherit; width:100%; text-align:inherit;
             padding:12px 14px; }
  .sortbtn:hover { color:var(--purple); }
  .sortbtn:focus-visible { outline:2px solid var(--purple); outline-offset:-2px; }
  th.sortable .sorthint { opacity:.5; font-size:10px; }
  /* The client name is the row's primary action as a real button, so the session
     detail is reachable by keyboard. The whole row stays clickable for the mouse. */
  .rowopen { background:none; border:none; padding:0; font-family:inherit; font-size:13px;
             font-weight:700; color:var(--ink); cursor:pointer; text-align:left; }
  .rowopen:hover { color:var(--purple); text-decoration:underline; }
  .rowopen:focus-visible { outline:2px solid var(--purple); outline-offset:2px; border-radius:3px; }
  /* Quiet, and absent entirely when there is nothing to clear. As a permanently
     lit white pill beside Export CSV it was a misclick that silently wiped a
     consultant's whole filter setup with no undo. */
  .fclear { background:none; border:none; border-radius:9px; padding:7px 10px; font-size:12px; font-weight:700; cursor:pointer; font-family:inherit; color:var(--muted); text-decoration:underline; text-underline-offset:3px; }
  .fclear:hover { color:var(--purple); }
  .fclear:focus-visible { outline:2px solid var(--purple); outline-offset:2px; }
  .fclear.hidden { display:none; }
  .emptybtn { background:#fff; border:1px solid #c3ccd6; border-radius:9px; padding:7px 15px; font-size:12px; font-weight:700; cursor:pointer; font-family:inherit; color:var(--teal); }
  .emptybtn:hover { background:#f1eefb; border-color:var(--purple); color:var(--purple); }
  .emptybtn:focus-visible { outline:2px solid var(--purple); outline-offset:2px; }
  /* Progressive disclosure for the six less-used filters. Search and status stay in the
     bar because they carry nearly all the traffic; package, language, progress and the
     date range were together making the filter row taller than the first table rows.
     Nothing is hidden dangerously: the active-filter chips below still name every
     filter in force, and the toggle carries a count when any of these are set. */
  .fmore { background:#fff; border:1px solid var(--border); border-radius:9px; padding:7px 13px; font-size:12px; font-weight:700; cursor:pointer; font-family:inherit; color:var(--teal); display:inline-flex; align-items:center; gap:6px; }
  .fmore:hover { border-color:var(--purple); color:var(--purple); }
  .fmore.on { background:var(--purple-soft); border-color:var(--purple); color:var(--purple); }
  .fmore:focus-visible { outline:2px solid var(--purple); outline-offset:2px; }
  /* The caret is what separates "a door" from "a value". It rotates on open, so
     the control also reports its own state without reading the aria. */
  .fcaret { font-size:9px; transition:transform .15s; }
  .fmore[aria-expanded="true"] .fcaret { transform:rotate(180deg); }
  .morefilters { flex-basis:100%; display:flex; gap:14px; align-items:center; flex-wrap:wrap; padding-top:12px; border-top:1px solid var(--border); }
  .morefilters.closed { display:none; }
  /* From/To are one filter (a range), so they read as one unit rather than two
     unrelated date pickers that happen to sit next to each other. */
  .fdates { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); }
  .fdates .fdash { color:var(--muted); }
  /* Active-filter chips: a visible, individually-removable summary of what's filtering. */
  #activeFilters { display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin:-4px 2px 16px; }
  #activeFilters:empty { display:none; }
  .aflabel { font-size:11px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:.04em; }
  .afchip { background:var(--purple-soft); color:var(--purple); border:none; border-radius:999px; padding:5px 12px; font-size:12px; font-weight:600; cursor:pointer; font-family:inherit; }
  .afchip span { font-weight:700; margin-left:5px; }
  .afchip:hover { background:#e3d9fb; }
  .afclear { background:transparent; border:none; color:var(--muted); text-decoration:underline; font-size:12px; cursor:pointer; font-family:inherit; padding:5px 4px; }
  .pill.inprog { background:#E8F1FE; color:#1d4ed8; }
  .pill.stalled { background:#FEF3E2; color:#92400e; }
  .pill.linksent { background:#eef1f5; color:#5b6b76; }
  tr.row[data-noopen] { cursor:default; }
  tr.row[data-noopen]:hover { background:transparent; }
  .tscroll { overflow-x:auto; }
  .pbar { width:84px; height:6px; background:#ece8f8; border-radius:3px; overflow:hidden; }
  .pbar i { display:block; height:100%; background:var(--purple); border-radius:3px; }
  /* I2: fade + scale in AND out (visibility toggle, not display, so the exit
     transition can play) instead of snapping on/off. */
  .modal { position:fixed; inset:0; background:rgba(15,23,42,.5); display:flex; align-items:center; justify-content:center; padding:20px; opacity:0; visibility:hidden; transition:opacity .16s ease, visibility 0s linear .16s; }
  .modal.show { opacity:1; visibility:visible; transition:opacity .16s ease; }
  .sheet { background:#fff; border-radius:var(--radius-lg); max-width:640px; width:100%; max-height:86vh; overflow:auto; padding:0; transform:scale(.97); transition:transform .16s ease; box-shadow:var(--shadow-modal); }
  .modal.show .sheet { transform:scale(1); }
  @media (prefers-reduced-motion: reduce){ .modal, .sheet { transition:none; } }
  .sheet h2 { margin:0 0 2px; font-size:17px; color:var(--teal); }
  .sheet .sub { color:var(--muted); font-size:12px; margin-bottom:16px; }
  .kv { display:grid; grid-template-columns:150px 1fr; gap:6px 14px; font-size:13px; margin-bottom:16px; }
  .kv .k { color:var(--muted); }
  .sec { font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--purple); margin:16px 0 6px; }
  .list { font-size:13px; }
  .list div { padding:4px 0; border-bottom:1px solid #f0f2f5; }
  .close { float:right; background:transparent; border:1px solid var(--border); border-radius:9px; padding:6px 13px; cursor:pointer; font-family:inherit; color:var(--muted); }
  /* A2: give the internal tools the same "alive" feedback as the chat. */
  button { transition:filter .15s ease, transform .08s ease; }
  button:not(:disabled):hover { filter:brightness(1.05); }
  button:not(:disabled):active { transform:translateY(1px); }
  /* .fclear dropped from this rule: it is now a borderless text button, and a
     filled hover background on it read as a stray highlight. It has its own hover. */
  .ghost:hover, .close:hover { background:#f1eefb; }
  /* E1: styled in-page access gate replacing window.prompt(). */
  /* Same hide-until-resolved as sales.html: the backdrop here is already opaque,
     but between first paint and the gate appearing the shell is readable. Less
     sensitive than the Sales form (no client data has loaded yet) but there is no
     reason to show a stranger the tool's chrome either. */
  html.gate-check .wrap, html.gate-locked .wrap { visibility: hidden; }
  .gate { position:fixed; inset:0; background:var(--bg); display:none; align-items:center; justify-content:center; padding:20px; z-index:200; }
  .gate.show { display:flex; }
  .gcard { background:#fff; border:1px solid var(--border); border-radius:var(--radius-lg); padding:28px; max-width:360px; width:100%; text-align:center; box-shadow:var(--shadow-modal); }
  .glogo { width:52px; height:52px; border-radius:50%; background:var(--purple-soft); display:inline-flex; align-items:center; justify-content:center; margin-bottom:14px; }
  .glogo img { width:30px; height:30px; display:block; }
  .gcard h2 { font-size:16px; margin:0 0 4px; color:var(--teal); }
  .gcard p { font-size:12.5px; color:var(--muted); margin:0 0 16px; line-height:1.5; }
  .gcard input { width:100%; border:1px solid var(--border); border-radius:9px; padding:10px 12px; font-size:14px; margin-bottom:10px; font-family:inherit; color:var(--ink); outline:none; }
  .gcard input:focus { border-color:var(--purple); box-shadow:0 0 0 3px rgba(124,58,237,.12); }
  .gerr { color:var(--cherry); font-size:12px; margin-bottom:10px; min-height:16px; }
  .gcard button { width:100%; background:var(--purple); color:#fff; border:none; border-radius:10px; padding:12px; font-size:14px; font-weight:700; cursor:pointer; font-family:inherit; box-shadow:0 4px 14px rgba(124,58,237,.28); }
  /* E4: sticky modal header + padded body so the title/close stay put in a long brief. */
  .sheethead { position:sticky; top:0; background:#fff; padding:20px 24px 12px; border-bottom:1px solid var(--border); z-index:2; border-radius:16px 16px 0 0; }
  .sheetbody { padding:16px 24px 24px; }
  .qbox { max-height:220px; overflow:auto; background:#f8fafb; border:1px solid var(--border); border-radius:9px; padding:10px; white-space:pre-wrap; font-family:monospace; font-size:12px; }
  /* E4: jump-to-section tabs in the sticky header. */
  .stabs { display:flex; gap:6px; margin-top:10px; flex-wrap:wrap; }
  .stabs button { background:var(--purple-soft); border:none; border-radius:999px; padding:5px 13px; font-size:11px; font-weight:700; color:var(--purple); cursor:pointer; font-family:inherit; }
  .stabs button:hover { background:#e3d9fb; }
  .sheetbody .sec { scroll-margin-top:96px; }
  /* Feature 5: amber "stalled sessions" banner above the KPIs. */
  .banner { display:flex; align-items:center; gap:12px; background:#FEF3E2; border:1px solid #F5D9A8; color:#92400e; border-radius:12px; padding:12px 16px; margin-bottom:16px; font-size:13px; line-height:1.4; }
  .banner button { margin-left:auto; flex-shrink:0; background:#92400e; color:#fff; border:none; border-radius:8px; padding:7px 13px; font-size:12px; font-weight:700; cursor:pointer; font-family:inherit; }
  /* Info variant for the "new activity" nudge (distinct from the amber stalled banner). */
  .banner.info { background:var(--purple-soft); border-color:#d9cbf7; color:var(--purple); }
  .banner.info button { background:var(--purple); }
  /* Feature 6: small "Copy handoff" action in the handoff section header. */
  .copybtn { float:right; background:var(--purple-soft); color:var(--purple); border:none; border-radius:8px; padding:3px 10px; font-size:10.5px; font-weight:700; cursor:pointer; font-family:inherit; text-transform:none; letter-spacing:normal; }

  /* ---- Insights panel (charts) ---- */
  .inshead { display:flex; align-items:center; gap:10px; margin:2px 2px 12px; }
  .inshead h2 { font-size:13px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:0; font-weight:700; }
  .instoggle { margin-left:auto; background:transparent; border:1px solid var(--border); border-radius:8px; padding:5px 12px; font-size:11.5px; color:var(--muted); cursor:pointer; font-family:inherit; font-weight:600; }
  .ins { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:20px; }
  .ins.hidden { display:none; }
  .chart { background:#fff; border:1px solid var(--border); border-radius:14px; padding:15px 16px; box-shadow:var(--shadow-raise); }
  .chart.wide { grid-column:1 / -1; }
  .chart h4 { margin:0 0 13px; font-size:11.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); font-weight:700; }
  .chart .nodata { font-size:12px; color:var(--muted); padding:8px 0 4px; }
  /* One-shot entrance the first time the panel appears (the .appear class is added
     once, then removed), so the bars grow in on load but don't re-animate or flicker
     on every filter/search re-render. */
  @keyframes insFade { from { opacity:0; transform:translateY(6px);} to { opacity:1; transform:none;} }
  /* Grow via transform (not width/height): the bar keeps its final layout size, so
     it is fully coloured the instant the one-shot animation ends and never leaves an
     empty track. transform-origin anchors the growth to the base of each bar. */
  @keyframes growW { from { transform:scaleX(0); } }
  @keyframes growH { from { transform:scaleY(0); } }
  .ins.appear .chart { animation:insFade .45s ease both; }
  .ins.appear .barfill, .ins.appear .ffill { animation:growW .7s cubic-bezier(.2,.8,.2,1) both; transform-origin:left center; }
  .ins.appear .cbar { animation:growH .6s cubic-bezier(.2,.8,.2,1) both; transform-origin:center bottom; }
  @media (prefers-reduced-motion: reduce){ .ins.appear .chart, .ins.appear .barfill, .ins.appear .ffill, .ins.appear .cbar { animation:none; } }
  /* Horizontal bars (by rep / package / language) */
  .barrow { display:flex; align-items:center; gap:10px; margin-bottom:9px; font-size:12px; }
  .barrow .lbl { width:34%; min-width:96px; flex-shrink:0; color:var(--teal); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .bartrack { flex:1; height:20px; background:#edeff4; border-radius:6px; overflow:hidden; }
  .barfill { display:block; height:100%; background:linear-gradient(90deg,#6d28d9,#8b5cf6); border-radius:6px; min-width:3px; }
  .barval { width:78px; flex-shrink:0; text-align:right; font-variant-numeric:tabular-nums; color:var(--teal); font-weight:700; }
  .barval small { color:var(--muted); font-weight:600; }
  /* Clickable breakdown rows (cross-filtering). */
  .barrow-click { cursor:pointer; padding:3px 6px; margin-left:-6px; margin-right:-6px; border-radius:8px; outline:none; }
  .barrow-click:hover { background:#f4f2fc; }
  .barrow-click:focus-visible { box-shadow:0 0 0 2px rgba(124,58,237,.4); }
  .barrow.active { background:#efeafe; }
  .barrow.active .lbl { color:var(--purple); font-weight:700; }
  /* Was #a9b0bd, which measures 2.18:1 on the white chart card — a real instruction
     rendered at 10px and effectively unreadable. It stays subordinate to the heading
     via size and sentence case, not by being too faint to read. */
  .chint { font-weight:600; text-transform:none; letter-spacing:0; color:var(--muted); font-size:10px; margin-left:6px; }
  /* Funnel */
  .fstage { margin-bottom:13px; }
  .fhead { display:flex; justify-content:space-between; align-items:baseline; font-size:12px; color:var(--muted); margin-bottom:4px; }
  .fhead b { color:var(--teal); font-size:16px; font-variant-numeric:tabular-nums; }
  .ftrack { height:16px; background:#edeff4; border-radius:8px; overflow:hidden; }
  .ffill { display:block; height:100%; border-radius:8px; min-width:3px; }
  .conv { font-size:10.5px; color:var(--muted); margin-top:3px; }
  /* Vertical bars (completions over time) */
  .spark { display:flex; align-items:flex-end; gap:5px; height:104px; }
  .scol { flex:1; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; height:100%; min-width:0; }
  .cval { font-size:10px; color:var(--teal); font-weight:700; margin-bottom:3px; }
  .cbar { width:100%; max-width:26px; background:linear-gradient(180deg,#a855f7,#7C3AED); border-radius:5px 5px 0 0; min-height:2px; }
  .clbl { font-size:9px; color:var(--muted); margin-top:6px; white-space:nowrap; }
  /* A week with no completions: a flat baseline and a muted 0, so an empty run
     reads as empty at a glance instead of as a row of small bars. */
  .czero { width:100%; max-width:26px; height:2px; background:var(--border); border-radius:2px; }
  .cval.zero { color:#aab6c6; font-weight:600; }
  /* The last column is the current week and is still filling up; mark it so a
     half-height final bar isn't misread as a drop. */
  .scol.cur .clbl { color:var(--purple); font-weight:700; }
  .scol.cur .cbar { background:linear-gradient(180deg,#c4a5fb,#9b6ef3); }

  @media (max-width:560px){ .wrap{padding:0 12px;} .kpis{grid-template-columns:1fr 1fr;} .ins{grid-template-columns:1fr;} th,td{padding:9px 8px;} .barlabel{display:none;} }
</style>

<body>
<script>
  document.documentElement.className += " gate-check";
  // Last resort: reveal the page ONLY if the gate module never executed at all
  // (script blocked, parse error) — in which case it can never unlock the page
  // and a permanent blank is worse than a readable form the server still blocks.
  // If the module IS running, it owns reveal/hide and we must not race it: firing
  // here mid-decision is exactly what flashed the internal form on a slow config
  // fetch. 8s clears both the 6s config cap and the 8s GIS-load cap.
  setTimeout(function () {
    if (!window.__lumenGateLoaded) {
      document.documentElement.classList.remove("gate-check");
      document.documentElement.classList.remove("gate-locked");
    }
  }, 8000);
</script>
  <div class="bar">
    <div class="mark"><img src="/lumen-mark.png" alt=""/></div>
    <div class="brand"><b>Lumen</b> <span class="by">by Talkwalker</span></div>
    <span class="barlabel">Proserv dashboard</span>
    <div class="baractions">
      <span class="count" id="count"></span>
      <span class="updated" id="updated"></span>
      <button class="refresh" id="refresh">Refresh</button>
    </div>
  </div>

  <!-- Google Sign-In gate. Shown BEFORE the token card, and only when the site has
       GOOGLE_CLIENT_ID + ALLOWED_EMAIL_DOMAIN set. Two independent locks on the
       surface that holds every client's PII, notes and transcripts: something you
       are (a work Google account) and something you know (the shared token). -->
  <div class="gate" id="gGate">
    <div class="gcard">
      <div class="glogo"><img src="/lumen-mark.png" alt=""/></div>
      <h2>Proserv dashboard</h2>
      <p id="gMsg">Sign in with your work Google account to continue.</p>
      <div id="gBtn" style="display:flex;justify-content:center;min-height:44px"></div>
      <div class="gerr" id="gErr"></div>
    </div>
  </div>

  <!-- E1: styled access gate; replaces the browser window.prompt() for the token. -->
  <div class="gate" id="gate">
    <form class="gcard" id="gateForm">
      <div class="glogo"><img src="/lumen-mark.png" alt=""/></div>
      <h2>Proserv access</h2>
      <p id="gateMsg">Enter the dashboard access token to view client onboarding sessions.</p>
      <input id="gateInput" type="password" autocomplete="current-password" placeholder="Access token" aria-label="Dashboard access token"/>
      <div class="gerr" id="gateErr"></div>
      <button type="submit">Continue</button>
    </form>
  </div>
  <div class="wrap">
    <h1>Client onboarding sessions</h1>
    <div id="stalledBanner"></div>
    <div id="updateBanner"></div>
    <div id="kpis" class="kpis" hidden></div>
    <div id="insightsWrap" hidden>
      <div class="inshead"><h2>Insights</h2><button type="button" id="insToggle" class="instoggle">Show</button></div>
      <div id="insights" class="ins hidden"></div>
    </div>
    <div id="filters" class="filters" hidden></div>
    <div id="activeFilters"></div>
    <div id="body"><div class="empty">Loading…</div></div>
  </div>

  <div class="modal" id="modal">
    <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Session detail" tabindex="-1"></div>
  </div>

<script src="/google-gate.js"></script>
<script>
  var SESSION_ENDPOINT = "/.netlify/functions/session";
  var SEED_ENDPOINT = "/.netlify/functions/seed";
  var ADMIN_ENDPOINT = "/.netlify/functions/session-admin";
  var $ = function (id) { return document.getElementById(id); };

  // ---- Access token gate ----
  // Session reads require the DASHBOARD_TOKEN set on the Netlify site. Ask once,
  // keep it for this browser tab (sessionStorage), re-ask if the server says 401.
  function getToken() { return sessionStorage.getItem("dash_token") || ""; }
  // E1: an in-page access card, not a browser window.prompt() (the first thing a
  // teammate sees shouldn't be a native prompt). requestToken() shows the gate and
  // resolves once a token is submitted and stored; the gate never rejects, so an
  // unauthenticated caller simply waits there.
  // Queue of pending resolvers (not a single slot): when several authedFetch calls
  // hit 401 close together, each pushes its resolver here and they ALL resolve when
  // one token is submitted. A single slot let the second 401 overwrite the first,
  // orphaning that fetch chain so the dashboard could hang on "Loading...".
  var _gateWaiters = [];
  function requestToken(message) {
    if (!$("gate").classList.contains("show")) {
      $("gateMsg").textContent = message || "Enter the dashboard access token to view client onboarding sessions.";
      $("gateErr").textContent = "";
      $("gateInput").value = "";
      $("gate").classList.add("show");
      setTimeout(function () { $("gateInput").focus(); }, 50);
    }
    return new Promise(function (resolve) { _gateWaiters.push(resolve); });
  }
  $("gateForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var t = $("gateInput").value.trim();
    if (!t) { $("gateErr").textContent = "Enter a token to continue."; return; }
    sessionStorage.setItem("dash_token", t);
    $("gate").classList.remove("show");
    var waiters = _gateWaiters; _gateWaiters = [];
    waiters.forEach(function (r) { r(); });
  });
  // ---- Google Sign-In gate (shared module: /google-gate.js) ----
  // Second, independent lock on top of the dashboard token. Logic is shared with
  // sales.html so the two pages can never drift apart on auth.
  var GGATE = LumenGoogleGate.create({
    gateEl: "gGate", msgEl: "gMsg", errEl: "gErr", btnEl: "gBtn",
    onUnlock: function () {
      var c = document.documentElement.classList; c.remove("gate-check"); c.remove("gate-locked");
      // The first read was deferred until the gate cleared; run it now.
      if (_gPending) { _gPending = false; load(); }
    },
    onLock: function () { var c = document.documentElement.classList; c.remove("gate-check"); c.add("gate-locked"); },
  });
  var _gPending = false;
  function googleHeaders(h) { return GGATE.headers(h); }
  // Arm the deferred-load flag before reauth: when the rep re-signs, onUnlock
  // fires and re-runs load(), so the dashboard refreshes itself instead of
  // sitting on the "couldn't load (401)" error until a manual Refresh.
  function reauthGoogle(msg) { _gPending = true; GGATE.reauth(msg); }
  function initGoogleGate() { return GGATE.init(); }

  function authedFetch(url) {
    return fetch(url, { headers: googleHeaders({ "x-dashboard-token": getToken() }) }).then(async function (r) {
      if (r.status === 401) {
        // Two gates now return 401, and they need opposite remedies: clearing the
        // stored dashboard token because the GOOGLE token expired would make a
        // teammate re-type a password that was never the problem.
        var isG = false;
        try { isG = (await r.clone().json()).error === "unauthorized_google"; } catch (e) {}
        if (isG) {
          reauthGoogle("Your sign-in expired. Sign in again to continue.");
          return r;
        }
        sessionStorage.removeItem("dash_token");
        return requestToken("That token was wrong or has expired. Enter it again.").then(function () { return authedFetch(url); });
      }
      return r;
    });
  }

  function fmtDuration(ms) {
    ms = num(ms);
    if (!ms) return "—";
    return Math.round(ms / 60000) + " min";
  }
  function fmtDate(iso) {
    if (!iso) return "—";
    try { return new Date(iso).toLocaleString(); } catch (e) { return iso; }
  }
  // "Last active" is the default sort and the column you scan straight down, where a
  // wall of "11/08/2026, 08:27:30" is far slower to read than "3d ago". Relative here,
  // exact on hover (title). Sorting and the CSV both work off the raw ISO value, so
  // neither is affected by how this renders. Past a month, an absolute date beats
  // "9w ago" — nobody counts weeks that far back.
  function fmtRelative(iso) {
    if (!iso) return "—";
    var t = Date.parse(iso);
    if (!isFinite(t)) return "—";
    var s = Math.floor((Date.now() - t) / 1000);
    if (s < 60) return "just now";            // also covers small negative clock skew
    var m = Math.floor(s / 60);
    if (m < 60) return m + " min ago";
    var h = Math.floor(m / 60);
    if (h < 24) return h + "h ago";
    var d = Math.floor(h / 24);
    if (d < 7) return d + "d ago";
    var w = Math.floor(d / 7);
    if (w < 5) return w + "w ago";
    try { return new Date(t).toLocaleDateString(); } catch (e) { return iso; }
  }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
      return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c];
    });
  }
  // Only allow links to Google's own document hosts to render as clickable. The
  // session record is POSTed by the client, so a tampered sheetUrl must never become
  // a live href, and esc() alone doesn't stop that.
  //
  // A scheme check on its own was not enough. It correctly blocked "javascript:" and
  // "data:", but any https URL still rendered as an anchor labelled "Open the client's
  // brief in Google Sheets" — a phishing link aimed at consultants, planted through
  // the unauthenticated session write and wearing a trusted label. The host allowlist
  // is the actual control; the scheme check is now just the first gate.
  var SHEET_HOSTS = ["docs.google.com", "drive.google.com", "sheets.google.com"];
  function safeUrl(u) {
    u = String(u == null ? "" : u).trim();
    if (!/^https:\/\//i.test(u)) return "";
    try {
      var h = new URL(u).hostname.toLowerCase();
      return SHEET_HOSTS.indexOf(h) !== -1 ? u : "";
    } catch (e) { return ""; }
  }
  // The client onboarding link for a seed, same shape the sales page generates.
  function clientLink(seedId) { return location.origin + "/chat?s=" + encodeURIComponent(seedId); }
  // Per-MTok rates for the model the proxy runs (claude-sonnet-4-x class):
  // input $3, output $15, cache write $3.75, cache read $0.30. Estimate only.
  var RATES = { input: 3, output: 15, cacheWrite: 3.75, cacheRead: 0.30 };
  // Coerce to a finite number; a non-numeric token field must never reach the
  // math (|| 0 lets a truthy string through and yields NaN tiles).
  function num(x) { x = +x; return Number.isFinite(x) ? x : 0; }
  function costOf(t) {
    if (!t) return null;
    return (num(t.input) * RATES.input + num(t.output) * RATES.output +
      num(t.cacheWrite) * RATES.cacheWrite + num(t.cacheRead) * RATES.cacheRead) / 1e6;
  }
  function totalTokens(t) {
    if (!t) return null;
    return num(t.input) + num(t.output) + num(t.cacheWrite) + num(t.cacheRead);
  }
  var STALE_MS = 48 * 3600 * 1000; // in-progress + idle past this reads as "stalled"
  function displayStatus(s) {
    if (s.status === "link_sent") return "link_sent";
    if (s.status === "completed") return "completed";
    var la = s.lastActiveAt ? Date.parse(s.lastActiveAt) : NaN;
    if (isFinite(la) && (Date.now() - la) > STALE_MS) return "stalled";
    return "in_progress";
  }
  var STATUS_META = {
    completed:   { l: "Completed",   c: "completed" },
    in_progress: { l: "In progress", c: "inprog" },
    stalled:     { l: "Stalled",     c: "stalled" },
    link_sent:   { l: "Link sent",   c: "linksent" },
  };
  function fmtCost(c) { return c == null ? "—" : "$" + c.toFixed(2); }
  function fmtTokens(n) {
    if (n == null) return "—";
    return n >= 1000 ? Math.round(n / 1000) + "k" : String(n);
  }
  function median(nums) {
    var a = nums.filter(function (n) { return n != null; }).sort(function (x, y) { return x - y; });
    if (!a.length) return null;
    var mid = Math.floor(a.length / 2);
    return a.length % 2 ? a[mid] : (a[mid - 1] + a[mid]) / 2;
  }

  // ---- Background "new activity" nudge ----
  var _loading = false, _snapIds = {}, _snapNewest = "";
  var UPDATE_POLL_MS = 90000;
  // Baseline the loaded set so the poll can tell what's new/updated since.
  function snapshotSessions(sessions) {
    _snapIds = {}; _snapNewest = "";
    sessions.forEach(function (s) {
      _snapIds[s.id] = 1;
      var t = s.lastActiveAt || s.sentAt || s.savedAt || "";
      if (t > _snapNewest) _snapNewest = t;
    });
  }
  // Poll the session list in the background; if it differs from what's loaded, show a
  // non-disruptive banner (never auto-replaces the view, so an open filter/sort/modal
  // is safe). Swallows errors and does NOT trigger the token gate, so a background 401
  // stays silent until the next manual action.
  function pollUpdates() {
    if (_loading || !getToken()) return;
    fetch(SESSION_ENDPOINT, { headers: googleHeaders({ "x-dashboard-token": getToken() }) })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        if (!d || !Array.isArray(d.sessions)) return;
        var newCount = 0, newest = "";
        d.sessions.forEach(function (s) {
          if (!_snapIds[s.id]) newCount++;
          var t = s.lastActiveAt || s.sentAt || s.savedAt || "";
          if (t > newest) newest = t;
        });
        var el = $("updateBanner"); if (!el) return;
        if (newCount > 0 || (newest && newest > _snapNewest)) {
          var msg = newCount > 0
            ? (newCount + (newCount === 1 ? " new session" : " new sessions") + " since you last loaded.")
            : "Sessions updated since you last loaded.";
          el.innerHTML = '<div class="banner info"><span>' + esc(msg) + '</span><button type="button" id="updRefresh">Refresh</button></div>';
          $("updRefresh").addEventListener("click", load);
        } else { el.innerHTML = ""; }
      })
      .catch(function () {});
  }

  async function load() {
    if (!getToken()) { await requestToken(); }
    _loading = true;
    var btn = $("refresh"), lbl = btn.textContent;
    btn.disabled = true; btn.textContent = "Refreshing…";
    $("body").innerHTML = '<div class="empty">Loading…</div>';
    LINKSENT = [];
    try {
      var r = await authedFetch(SESSION_ENDPOINT + (SHOW_ARCHIVED ? "?archived=1" : ""));
      if (!r.ok) throw new Error("HTTP " + r.status);
      var data = await r.json();
      render(data.sessions || []);
      $("updated").textContent = "Updated " + new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
      // Deep link from the Slack "View full session" link: ?id=<sessionId> opens
      // that session's detail straight away (independent of the list).
      var deepId = new URLSearchParams(location.search).get("id");
      if (deepId) openSession(deepId);
      loadLinkSent();
    } catch (e) {
      $("kpis").hidden = true; $("filters").hidden = true; $("insightsWrap").hidden = true;
      $("stalledBanner").innerHTML = "";
      $("body").innerHTML = '<div class="err">Could not load sessions (' + esc(e.message) + '). Check the session function is deployed.</div>';
      $("count").textContent = ""; $("updated").textContent = "";
    } finally {
      _loading = false; btn.disabled = false; btn.textContent = lbl;
    }
  }

  // Fetch generated links and surface those never opened (no matching session)
  // as "Link sent" rows — the top of the funnel. Best-effort: any failure just
  // omits them and leaves the session rows untouched.
  function loadLinkSent() {
    // Archived view shows archived seeds too, so a link generated for a test and never
    // opened is archivable and deletable alongside everything else.
    authedFetch(SEED_ENDPOINT + (SHOW_ARCHIVED ? "?archived=1" : ""))
      .then(function (r) { return r.ok ? r.json() : { seeds: [] }; })
      .then(function (d) {
        var seeds = (d && d.seeds) || [];
        var seen = {}, meta = {};
        SESSIONS.forEach(function (s) { if (s.seedId) seen[s.seedId] = 1; });
        // Join the consultant (owner), package and chat language onto each session by
        // seedId. All three live only in the token-gated seed store, never on the
        // client-facing session record, so we resolve them here.
        seeds.forEach(function (x) { if (x && x.id) meta[x.id] = { owner: x.preparedBy || "", pkg: x.package || "", lang: x.language || "" }; });
        SESSIONS.forEach(function (s) {
          var m = s.seedId && meta[s.seedId];
          if (m) { if (m.owner) s.owner = m.owner; s.pkg = m.pkg; s.lang = m.lang; }
          // The language the client ACTUALLY ran in wins over the one Sales seeded.
          // They can differ: the welcome-back screen lets a client change language
          // after starting (see langOverrideRef in src/lumen.jsx), so a session seeded
          // in English can genuinely be conducted in French. This also gives a language
          // to sessions whose seed has been archived or deleted, which previously had
          // none at all because s.lang was only set inside the `if (m)` above.
          if (s.uiLang) s.lang = s.uiLang;
        });
        LINKSENT = seeds.filter(function (x) { return x && x.id && !seen[x.id]; }).map(function (x) {
          return { id: x.id, company: x.company || "(unnamed)", contact: x.contactName || "", email: x.email || "",
            owner: x.preparedBy || "", pkg: x.package || "", lang: x.language || "",
            topicCount: 0, channelCount: 0, userCount: 0, status: "link_sent", percent: 0,
            durationMs: null, apiCalls: null, tokens: null, sheetUrl: null, hasHandoff: false,
            seeded: true, seedId: x.id, lastActiveAt: x.savedAt || null, sentAt: null, savedAt: x.savedAt || null, _linkSent: true };
        });
        // Only build the filter bar + table when there is actually something to
        // show. Without this guard, a fresh deploy (0 sessions AND 0 unopened seeds)
        // has its friendly "No onboarding sessions yet" empty state clobbered by a
        // filter bar + "No sessions match. Showing 0 of 0" — which wrongly implies a
