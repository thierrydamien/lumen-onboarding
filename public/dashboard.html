      // when we actually have an address to send to.
      if (s.email) {
        cbtn += ' <button type="button" class="remind" data-link="1" data-id="' + esc(s.id) + '">Send reminder</button>';
      }
      rep = (rep === dash) ? cbtn : rep + ' ' + cbtn;
    }
    var tok = totalTokens(s.tokens);
    // Selection checkbox. data-link marks it as "handles its own click", which is the
    // existing convention the row-open handler already respects, so ticking a box
    // never opens the session detail. A link-sent pseudo-row is a SEED, not a session,
    // and the two live in different stores — carry the kind so the server addresses
    // the right one rather than guessing from the id.
    var selKind = s._linkSent ? "seed" : "session";
    var selKey = selKind + ":" + s.id;
    var selCell = '<td class="selcol"><input type="checkbox" data-link="1" data-sel="' + esc(selKey) +
      '" aria-label="Select ' + esc(s.company || "session") + '"' + (SELECTED[selKey] ? " checked" : "") + '/></td>';
    // The name is a button on rows that HAVE a session to open, and plain text on
    // "link sent" rows (a link generated but never opened has no detail to show), so
    // the keyboard affordance never promises something the click would not do.
    // data-link marks it as handling its own click, the convention the row handler
    // already respects, so it opens once rather than twice.
    var nameCell = s._linkSent
      ? '<strong>' + esc(s.company) + '</strong>'
      : '<button type="button" class="rowopen" data-link="1" data-open="' + esc(s.id) + '">' + esc(s.company) + '</button>';
    return '<tr class="row"' + (s._linkSent ? ' data-noopen="1"' : '') + ' data-id="' + esc(s.id) + '">' + selCell +
      '<td>' + nameCell + (s.seeded && !s._linkSent ? '<span class="chip">seeded</span>' : "") +
        '<div class="muted">' + esc(s.contact || s.email || "") + '</div></td>' +
      '<td><span class="pill ' + meta.c + '">' + esc(meta.l) + '</span></td>' +
      '<td><div class="pbar"><i style="width:' + pct + '%"></i></div><div class="sub2">' + pct + '%</div></td>' +
      '<td>' + num(s.topicCount) + ' topics · ' + num(s.channelCount) + ' channels · ' + num(s.userCount) + ' users</td>' +
      '<td>' + fmtDuration(s.durationMs) + '</td>' +
      '<td class="num">' + fmtTokens(tok) + '<div class="sub2">' + fmtCost(costOf(s.tokens)) + (typeof s.apiCalls === "number" ? ' · ' + s.apiCalls + ' calls' : "") + '</div></td>' +
      '<td class="muted"><span title="' + esc(fmtDate(s.lastActiveAt || s.sentAt || s.savedAt)) + '">' +
        esc(fmtRelative(s.lastActiveAt || s.sentAt || s.savedAt)) + '</span></td>' +
      '<td class="muted">' + (s.owner ? esc(s.owner) : '<span class="none">—</span>') + '</td>' +
      '<td class="rep">' + rep + '</td>' +
    '</tr>';
  }

  // ---- Archive / delete -----------------------------------------------------
  // Two-stage by design: archiving only hides a row and is reversible; permanent
  // deletion is refused by the server unless the record is already archived. There is
  // no second password — the confirm dialogs (which name the affected clients) and the
  // "type DELETE" step are the guard against a misclick.
  var SELECTED = {};          // "kind:id" -> true, for the current view
  var SHOW_ARCHIVED = false;

  function selCount() { return Object.keys(SELECTED).length; }
  function clearSel() { SELECTED = {}; }

  // The rows currently on screen, so selection changes can be repainted without
  // re-running the whole table (and with it the KPI cards and the insight charts).
  var LAST_LIST = [];

  // Repaint ONLY what a selection change affects: the bulk bar and the select-all box.
  // Ticking a checkbox used to call renderTable(), which also recomputes renderKpis()
  // and renderInsights() — so clearing twenty test rows meant twenty full table
  // rebuilds and twenty chart recomputations. Nothing about the rows themselves
  // changes when you tick one, so none of that work is needed.
  function paintSelection() {
    var slot = document.getElementById("bulkSlot");
    if (slot) {
      slot.innerHTML = bulkBarHtml();
      var bClear = document.getElementById("bulkClear");
      if (bClear) bClear.addEventListener("click", function () { clearSel(); syncBoxes(); paintSelection(); });
      var bArch = document.getElementById("bulkArchive");
      if (bArch) bArch.addEventListener("click", function () { adminAction("archive"); });
      var bRest = document.getElementById("bulkRestore");
      if (bRest) bRest.addEventListener("click", function () { adminAction("restore"); });
      var bDel = document.getElementById("bulkDelete");
      if (bDel) bDel.addEventListener("click", function () { adminAction("delete"); });
    }
    var selAll = document.getElementById("selAll");
    if (selAll) {
      var shown = LAST_LIST.map(selKeyOf);
      var picked = shown.filter(function (k) { return SELECTED[k]; }).length;
      selAll.checked = shown.length > 0 && picked === shown.length;
      // A partial selection must not look identical to an empty one. Without this, one
      // row ticked out of thirty leaves the header box plainly unchecked.
      selAll.indeterminate = picked > 0 && picked < shown.length;
    }
  }
  // Push SELECTED back onto the rendered checkboxes (used by Clear and select-all,
  // where the boxes did not change themselves).
  function syncBoxes() {
    Array.prototype.forEach.call(document.querySelectorAll("input[data-sel]"), function (cb) {
      cb.checked = !!SELECTED[cb.getAttribute("data-sel")];
    });
  }
  function selKeyOf(s) { return (s._linkSent ? "seed" : "session") + ":" + s.id; }

  function bulkBarHtml() {
    var n = selCount();
    if (!n) return "";
    var verb = SHOW_ARCHIVED
      ? '<button type="button" class="bulkbtn" id="bulkRestore">Restore ' + n + '</button>' +
        '<button type="button" class="bulkbtn danger" id="bulkDelete">Delete permanently…</button>'
      : '<button type="button" class="bulkbtn" id="bulkArchive">Archive ' + n + '</button>';
    return '<div class="bulkbar"><span>' + n + ' selected</span>' + verb +
      '<button type="button" class="bulkbtn ghost" id="bulkClear">Clear</button></div>';
  }

  function selectedItems() {
    return Object.keys(SELECTED).map(function (k) {
      var i = k.indexOf(":");
      return { kind: k.slice(0, i), id: k.slice(i + 1) };
    });
  }
  // Names for the confirm dialog. Showing what is about to happen is the real guard
  // against a mis-set filter: the count alone would not reveal a wrong selection.
  function selectedNames() {
    var byKey = {};
    SESSIONS.concat(LINKSENT).forEach(function (s) {
      byKey[(s._linkSent ? "seed" : "session") + ":" + s.id] = s.company || "(unnamed)";
    });
    return Object.keys(SELECTED).map(function (k) { return byKey[k] || k; });
  }

  async function adminAction(action) {
    var items = selectedItems();
    if (!items.length) return;
    var names = selectedNames();
    var preview = names.slice(0, 12).join(", ") + (names.length > 12 ? ", and " + (names.length - 12) + " more" : "");

    if (action === "delete") {
      // Deliberately heavier than the archive confirm: this is the irreversible one,
      // and it reaches beyond the dashboard into stores the operator cannot see.
      if (!window.confirm(
        "Permanently delete " + items.length + " archived record(s)?\n\n" + preview +
        "\n\nThis cannot be undone. It also removes the client link, its saved progress, " +
        "and any resume draft.\n\nIt does NOT remove the Google Sheet or any Slack messages " +
        "already sent — delete those separately if you need to.")) return;
      if (window.prompt('Type DELETE to confirm.') !== "DELETE") return;
    } else if (action === "archive") {
      if (!window.confirm("Archive " + items.length + " record(s)?\n\n" + preview +
        "\n\nThey are hidden from this view but nothing is deleted, and the client link keeps working. " +
        "You can restore them from “Show archived”.")) return;
    }

    var res;
    try {
      res = await fetch(ADMIN_ENDPOINT, {
        method: "POST",
        headers: googleHeaders({ "Content-Type": "application/json", "x-dashboard-token": getToken() }),
        body: JSON.stringify({ action: action, items: items }),
      });
    } catch (e) { window.alert("Could not reach the server. Nothing was changed."); return; }

    if (res.status === 401) {
      window.alert("Not authorized. Try refreshing and re-entering the dashboard password.");
      return;
    }
    if (res.status === 429) { window.alert("Too many admin actions in a short time. Wait a moment and try again."); return; }
    var d = await res.json().catch(function () { return {}; });
    if (!res.ok) { window.alert("That did not go through. Nothing was changed."); return; }

    // Report partial success honestly rather than implying everything worked. The
    // commonest reason is delete-before-archive, which the server refuses by design.
    if (d.applied !== d.requested) {
      var notArchived = (d.results || []).filter(function (r) { return r.error === "not_archived"; }).length;
      window.alert("Applied to " + d.applied + " of " + d.requested + "." +
        (notArchived ? "\n\n" + notArchived + " were skipped because they must be archived before they can be deleted." : ""));
    }
    clearSel();
    load();
  }

  var COLS = [
    { label: "", key: null, cls: "selcol", sel: true },
    { label: "Client", key: "company" }, { label: "Status", key: "status" },
    { label: "Progress", key: "percent" }, { label: "Captured", key: null },
    { label: "Time", key: "time" }, { label: "Tokens / cost", key: "tokens", cls: "num" },
    { label: "Last active", key: "lastActive" }, { label: "Prepared by", key: "owner" }, { label: "Report", key: null },
  ];

  // Shared filter predicate for the current view. renderTable() (table + KPIs)
  // and exportCsv() both build off this, so the CSV export always mirrors exactly
  // what the table shows. Returns the filtered (unsorted) list.
  // Parse a yyyy-mm-dd filter value into a LOCAL-time epoch ms boundary. end=true
  // returns end-of-day (23:59:59.999). Empty/invalid -> NaN (unbounded).
  function localDay(s, end) {
    if (!s) return NaN;
    var p = String(s).split("-");
    if (p.length !== 3) return NaN;
    var d = end ? new Date(+p[0], +p[1] - 1, +p[2], 23, 59, 59, 999)
                : new Date(+p[0], +p[1] - 1, +p[2], 0, 0, 0, 0);
    var t = d.getTime();
    return isFinite(t) ? t : NaN;
  }
  // Sort a list in place by the active sort column/direction. Shared by the table
  // and the CSV export so the export matches the on-screen order.
  function sortList(list) {
    var dir = FILTER.sortDir === "asc" ? 1 : -1;
    return list.sort(function (a, b) {
      var va = sortVal(a, FILTER.sortKey), vb = sortVal(b, FILTER.sortKey);
      if (typeof va === "string") return va.localeCompare(vb) * dir;
      return (va - vb) * dir;
    });
  }
  function getFilteredList(except) {
    var q = FILTER.q.trim().toLowerCase();
    // Owner data is joined onto sessions only after the seed fetch resolves
    // (loadLinkSent). Apply the owner filter ONLY when owners are actually known,
    // so an active owner filter can't hide every row during the initial render, on
    // Refresh, or if the seed fetch fails (which would also hide the Owner dropdown,
    // leaving an invisible filter recoverable only via Clear).
    var ownersKnown = SESSIONS.concat(LINKSENT).some(function (s) { return s.owner; });
    // Package/language are joined from the seed store on the same async pass as owner,
    // so gate their filters the same way: don't apply until the data is actually known,
    // or a Refresh with an active filter would blank the table until the join lands.
    var pkgKnown = SESSIONS.concat(LINKSENT).some(function (s) { return s.pkg; });
    var langKnown = SESSIONS.concat(LINKSENT).some(function (s) { return s.lang; });
    // Feature 4: date range. "To" is inclusive to end-of-day. Empty = unbounded.
    // Parse the yyyy-mm-dd inputs as LOCAL day boundaries (not Date.parse, which
    // reads a date-only string as UTC midnight). The table shows timestamps in
    // local time, so a UTC boundary would drop near-midnight rows off the wrong
    // end for any viewer west of UTC (e.g. Vancouver).
    var fromMs = localDay(FILTER.dateFrom, false);
    var toMs = localDay(FILTER.dateTo, true);
    return SESSIONS.concat(LINKSENT).filter(function (s) {
      if (FILTER.status.length && FILTER.status.indexOf(displayStatus(s)) === -1) return false;
      if (FILTER.minPct > 0 && (s.percent != null ? s.percent : 0) < FILTER.minPct) return false;
      if (except !== "owner" && ownersKnown && FILTER.owner && FILTER.owner !== "all" && (s.owner || "") !== FILTER.owner) return false;
      if (except !== "pkg" && pkgKnown && FILTER.pkg && FILTER.pkg !== "all" && (s.pkg || "") !== FILTER.pkg) return false;
      if (except !== "lang" && langKnown && FILTER.lang && FILTER.lang !== "all" && (s.lang || "") !== FILTER.lang) return false;
      if (isFinite(fromMs) || isFinite(toMs)) {
        var when = Date.parse(s.lastActiveAt || s.sentAt || s.savedAt || "");
        // A row with no parseable date can't fall inside a bounded range, so drop it.
        if (isFinite(fromMs) && !(when >= fromMs)) return false;
        if (isFinite(toMs) && !(when <= toMs)) return false;
      }
      if (q) {
        var hay = ((s.company || "") + " " + (s.contact || "") + " " + (s.email || "") + " " + (s.owner || "") + " " + pkgLabel(s.pkg) + " " + (s.lang || "")).toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      return true;
    });
  }

  // Active-filter chips: a labelled, individually-removable summary of everything
  // currently filtering, so removing one filter (e.g. a language set by clicking a
  // chart bar) is one obvious click rather than "re-click the highlighted bar".
  // Which dimensions are currently narrowing the list, as clear-keys. ONE definition,
  // read by the chips, the "More filters" badge and the empty state, so those three can
  // never disagree about whether a filter is active.
  function activeFilterDims() {
    var d = [];
    FILTER.status.forEach(function (st) { d.push("status:" + st); });
    if (FILTER.minPct > 0) d.push("minPct");
    if (FILTER.owner && FILTER.owner !== "all") d.push("owner");
    if (FILTER.pkg && FILTER.pkg !== "all") d.push("pkg");
    if (FILTER.lang && FILTER.lang !== "all") d.push("lang");
    if (FILTER.q && FILTER.q.trim()) d.push("q");
    if (FILTER.dateFrom) d.push("dateFrom");
    if (FILTER.dateTo) d.push("dateTo");
    return d;
  }
  function filterLabel(dim) {
    if (dim.indexOf("status:") === 0) { var st = dim.slice(7); return "Status: " + ((STATUS_META[st] || {}).l || st); }
    if (dim === "minPct") return "Progress: ≥" + FILTER.minPct + "%";
    if (dim === "owner") return "Prepared by: " + FILTER.owner;
    if (dim === "pkg") return "Package: " + pkgLabel(FILTER.pkg);
    if (dim === "lang") return "Language: " + FILTER.lang;
    if (dim === "q") return 'Search: "' + FILTER.q.trim() + '"';
    if (dim === "dateFrom") return "From: " + FILTER.dateFrom;
    if (dim === "dateTo") return "To: " + FILTER.dateTo;
    return dim;
  }
  // The dimensions that live behind "More filters". Search and status stay in the bar.
  var SECONDARY_DIMS = ["minPct", "owner", "pkg", "lang", "dateFrom", "dateTo"];
  function secondaryFilterCount() {
    return activeFilterDims().filter(function (d) { return SECONDARY_DIMS.indexOf(d) !== -1; }).length;
  }

  // The "More filters" badge reflects FILTER, but the controls inside the panel call
  // only renderTable() on change (re-rendering the bar would destroy the <select> the
  // user is mid-interaction with, and drop focus). So repaint just the badge in place,
  // on every table render. Without this the count silently never appears.
  function paintMoreBadge() {
    var b = $("fMore"); if (!b) return;
    var n = secondaryFilterCount();
    // Write to the LABEL span, not the button: the button also holds the caret,
    // and setting its textContent would delete that on the next table render.
    var lab = $("fMoreLabel");
    if (lab) lab.textContent = "More filters" + (n ? " (" + n + ")" : "");
    b.classList.toggle("on", n > 0);
    // Clear only exists when there is something to clear. Repainted here (rather
    // than only in renderFilters) because the panel's selects call renderTable
    // alone, so a filter set from inside the panel must still reveal it.
    var c = $("fClear");
    if (c) c.classList.toggle("hidden", activeFilterDims().length === 0);
  }

  function renderActiveFilters() {
    paintMoreBadge();
    var el = $("activeFilters"); if (!el) return;
    var dims = activeFilterDims();
    if (!dims.length) { el.innerHTML = ""; return; }
    el.innerHTML = '<span class="aflabel">Filtering:</span>' +
      dims.map(function (d) { return '<button type="button" class="afchip" data-clear="' + esc(d) + '">' + esc(filterLabel(d)) + ' <span aria-hidden="true">×</span></button>'; }).join("") +
      '<button type="button" class="afclear" data-clear="__all__">Clear all</button>';
  }
  // ONE definition of "reset everything", shared by the Clear button, the
  // empty-state escape hatch and the "Clear all" chip. It used to live inside the
  // Clear button's handler with the other two calling .click() on it — which meant
  // the reset silently depended on that button being present in the DOM, and Clear
  // is now hidden when no filter is active.
  function clearAllFilters() {
    FILTER = defaultFilter();
    renderFilters(); renderTable();
  }
  // Reset a single filter (or all) to its default, then re-render.
  function clearFilter(dim) {
    if (dim === "__all__") { clearAllFilters(); return; }
    // "status:<value>" removes just that one status; bare "status" clears them all.
    if (dim.indexOf("status:") === 0) {
      var st = dim.slice(7), si = FILTER.status.indexOf(st);
      if (si !== -1) FILTER.status.splice(si, 1);
      renderFilters(); renderTable(); return;
    }
    var defs = { status: [], minPct: 0, owner: "all", pkg: "all", lang: "all", q: "", dateFrom: "", dateTo: "" };
    if (dim in defs) { FILTER[dim] = defs[dim]; renderFilters(); renderTable(); }
  }

  function renderTable() {
    var list = getFilteredList();
    // KPI cards + insight charts sit above the filters and must agree with what's
    // shown, so recompute them from the filtered list on every filter/search/sort
    // change (renderKpis drops the link-sent pseudo-rows itself).
    renderKpis(list);
    renderInsights(list);
    renderActiveFilters();
    sortList(list);
    LAST_LIST = list; // what select-all and the bulk bar act on
    var arrow = FILTER.sortDir === "asc" ? " ▲" : " ▼";
    var head = '<table><thead><tr>' + COLS.map(function (c) {
      // Select-all applies to the CURRENT FILTERED VIEW, not the whole store. That is
      // the safe reading: you tick what you can see, and what you can see is what the
      // confirm dialog will list back to you.
      if (c.sel) return '<th class="selcol"><input type="checkbox" id="selAll" aria-label="Select all shown"/></th>';
      if (!c.key) return '<th' + (c.cls ? ' class="' + c.cls + '"' : "") + '>' + esc(c.label) + '</th>';
      var active = FILTER.sortKey === c.key;
      // A resting sortable header must LOOK sortable: show a faint ⇅ until it is
      // the active sort (then the real ▲/▼ takes over). Hover-only affordances are
      // invisible until stumbled upon, and don't exist at all on touch.
      // aria-sort on the th announces the current sort; the button inside it is what
      // makes sorting reachable at all without a mouse.
      var aSort = active ? (FILTER.sortDir === "asc" ? "ascending" : "descending") : "none";
      return '<th class="sortable' + (c.cls ? " " + c.cls : "") + '" aria-sort="' + aSort + '">' +
        '<button type="button" class="sortbtn" data-sort="' + c.key + '">' +
        esc(c.label) + (active ? arrow : ' <span class="sorthint" aria-hidden="true">⇅</span>') + '</button></th>';
    }).join("") + '</tr></thead><tbody>';
    // Empty state names how many filters are responsible and offers the way out. "No
    // sessions match." alone left the reader to work out that the cause was a filter
    // and to go find the control that set it.
    var nDims = activeFilterDims().length;
    var bodyRows = list.length ? list.map(rowHtml).join("")
      : '<tr><td colspan="' + COLS.length + '" class="empty" style="padding:32px 24px">' +
          '<div style="font-size:15px;font-weight:700;color:var(--teal);margin-bottom:4px">No sessions match</div>' +
          '<div style="margin-bottom:14px">' + (nDims
            ? (nDims === 1 ? "One filter is" : nDims + " filters are") + " narrowing the list."
            : "Nothing to show here.") + '</div>' +
          // NOT .fclear: in the bar that is a deliberately quiet ghost sitting beside
          // Export CSV, but here it is the only way out of an empty table and has to
          // read as the primary action.
          (nDims ? '<button type="button" class="emptybtn" id="emptyClear">Clear filters</button>' : "") +
        '</td></tr>';
    $("body").innerHTML =
      '<div id="bulkSlot"></div>' +
      '<div class="tscroll">' + head + bodyRows + '</tbody></table></div>' +
      '<div class="note">Showing ' + list.length + ' of ' + (SESSIONS.length + LINKSENT.length) + '. A session is stored from the client\'s first real answer (marked in progress) and updated as they go; the completed record replaces it on send. "Stalled" = in progress with no activity for 48h. AI cost is an estimate at $' + RATES.input + '/$' + RATES.output + ' per MTok in/out (plus cache rates).</div>';
    // Selection + bulk actions. Rebound on every render because the table is
    // re-created wholesale; SELECTED survives in module state so ticks persist across
    // a sort or filter change.
    Array.prototype.forEach.call(document.querySelectorAll("input[data-sel]"), function (cb) {
      cb.addEventListener("change", function () {
        var k = cb.getAttribute("data-sel");
        if (cb.checked) SELECTED[k] = true; else delete SELECTED[k];
        paintSelection(); // not renderTable: the rows themselves have not changed
      });
    });
    var selAll = document.getElementById("selAll");
    if (selAll) selAll.addEventListener("change", function () {
      // Scoped to the rows currently shown, so it never reaches past the filter.
      LAST_LIST.map(selKeyOf).forEach(function (k) {
        if (selAll.checked) SELECTED[k] = true; else delete SELECTED[k];
      });
      syncBoxes();
      paintSelection();
    });
    paintSelection();

    Array.prototype.forEach.call(document.querySelectorAll(".sortbtn"), function (b) {
      b.addEventListener("click", function () {
        var k = b.getAttribute("data-sort");
        if (FILTER.sortKey === k) { FILTER.sortDir = FILTER.sortDir === "asc" ? "desc" : "asc"; }
        else { FILTER.sortKey = k; FILTER.sortDir = k === "company" ? "asc" : "desc"; }
        renderTable();
        // The table is rebuilt wholesale, so focus would fall back to <body> and a
        // keyboard user would lose their place mid-sort. Put it back on the same column.
        var again = document.querySelector('.sortbtn[data-sort="' + k + '"]');
        if (again) again.focus();
      });
    });
    // Empty-state escape hatch. Calls the shared reset directly, so there is one
    // reset path rather than two that can drift — and it no longer breaks if the
    // Clear button is hidden.
    var ec = $("emptyClear");
    if (ec) ec.addEventListener("click", clearAllFilters);
    // Opening a session from the keyboard: the row's name button. Mouse users can still
    // click anywhere on the row (handler below); this is the same action, reachable.
    Array.prototype.forEach.call(document.querySelectorAll(".rowopen"), function (b) {
      b.addEventListener("click", function (e) {
        e.stopPropagation();
        openSession(b.getAttribute("data-open"));
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll("tr.row"), function (tr) {
      tr.addEventListener("click", function (e) {
        if (tr.getAttribute("data-noopen")) return; // link-sent rows have no session detail yet
        if (e.target.closest && e.target.closest('[data-link]')) return; // let the Sheet link / Copy-link button handle their own click
        openSession(tr.getAttribute("data-id"));
      });
    });
    // Copy-link buttons on link-sent / stalled rows: copy the client link to re-send.
    Array.prototype.forEach.call(document.querySelectorAll(".copylink"), function (b) {
      b.addEventListener("click", function (e) {
        e.stopPropagation();
        copyText(b.getAttribute("data-copy"), b, "Copy link");
      });
    });
    // Reminder buttons: open a pre-filled Gmail draft for a stalled/unopened client.
    Array.prototype.forEach.call(document.querySelectorAll(".remind"), function (b) {
      b.addEventListener("click", function (e) {
        e.stopPropagation();
        var id = b.getAttribute("data-id");
        var s = null;
        for (var i = 0; i < SESSIONS.length; i++) { if (SESSIONS[i].id === id) { s = SESSIONS[i]; break; } }
        if (s) openReminderDraft(s);
      });
    });
  }

  // Pre-filled reminder to a client who started (or was sent a link) and went quiet.
  // Opens a Gmail COMPOSE WINDOW rather than sending: the consultant reads it, adds
  // anything client-specific, and sends from their own account under their own name
  // and signature. Nothing is sent automatically, and the draft is AI-drafted copy a
  // human signs off, which is the posture we want for client-facing mail.
  function openReminderDraft(s) {
    var first = String(s.contact || "").trim().split(/\s+/)[0] || "there";
    var company = s.company && s.company !== "(unnamed)" ? s.company : "your team";
    var link = s.seedId ? clientLink(s.seedId) : "";
    var subject = "Pick up your Lumen setup where you left off";
    var body = [
      "Hi " + first + ",",
      "",
      "You started your Lumen requirements gathering recently and got partway through. Whenever you have a few minutes, you can continue right where you stopped using the same link:",
      "",
      link,
      "",
      "Finishing it means we can configure " + company + "'s dashboards, topics, and alerts to match how you actually work, so there's less to sort out on your review session. It usually takes about 15 minutes, and you don't need every answer ready.",
      "",
      "If anything is unclear, or you'd rather walk through it together, just reply and we'll find a time.",
      "",
      "Thanks,"
    ].join("\n");
    var gmail = "https://mail.google.com/mail/?view=cm&fs=1"
      + "&to=" + encodeURIComponent(s.email || "")
      + "&su=" + encodeURIComponent(subject)
      + "&body=" + encodeURIComponent(body);
    window.open(gmail, "_blank", "noopener");
  }

  // Feature 3: CSV field escaping. Wrap in double quotes when the value contains
  // a comma, quote or newline, and double any internal quotes.
  function csvCell(v) {
    var s = String(v == null ? "" : v);
    // Neutralize spreadsheet formula injection: a field starting with = + - @ (or
    // a tab/CR) can be executed as a formula by Excel/Sheets. Client-POSTed fields
    // (company, contact, email, prepared by, sheet url) are untrusted, so prefix a
    // single quote to force the cell to text before the delimiter-escaping below.
    if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
    return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }
  // Feature 3: export EXACTLY the current filtered view (same predicate the table
  // uses, via getFilteredList) as a CSV, downloaded client-side via a Blob URL.
  function exportCsv() {
    var list = sortList(getFilteredList()); // match the on-screen sort order
    var headers = ["Client", "Contact", "Email", "Status", "Progress %", "Package", "Language", "Topics", "Channels", "Users", "Time (min)", "Tokens", "Est cost", "Last active", "Prepared by", "Sheet URL"];
    var lines = [headers.map(csvCell).join(",")];
    list.forEach(function (s) {
      var meta = STATUS_META[displayStatus(s)] || STATUS_META.in_progress;
      var tok = totalTokens(s.tokens);
      var cost = costOf(s.tokens);
      lines.push([
        s.company || "",
        s.contact || "",
        s.email || "",
        meta.l,
        s.percent != null ? num(s.percent) : 0,
        pkgLabel(s.pkg),
        s.lang || "",
        num(s.topicCount),
        num(s.channelCount),
        num(s.userCount),
        s.durationMs != null ? Math.round(num(s.durationMs) / 60000) : "",
        tok != null ? tok : "",
        cost != null ? cost.toFixed(2) : "",
        s.lastActiveAt || s.sentAt || s.savedAt || "",
        s.owner || "",
        safeUrl(s.sheetUrl)
      ].map(csvCell).join(","));
    });
    var csv = lines.join("\r\n") + "\r\n";
    // Lead with a UTF-8 BOM so Excel (Windows) reads accented/Arabic client and
    // contact names correctly instead of mojibake.
    var blob = new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8;" });
    var url = URL.createObjectURL(blob);
    var d = new Date();
    var stamp = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
    var a = document.createElement("a");
    a.href = url;
    a.download = "lumen-sessions-" + stamp + ".csv";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 0);
  }

  // Feature 5: count stalled sessions across ALL sessions (not the filtered
  // list) and surface an amber banner above the KPIs. Clicking it filters to
  // stalled. Recomputed on every data reload (called from render).
  function renderStalledBanner() {
    var el = $("stalledBanner");
    if (!el) return;
    var n = SESSIONS.filter(function (s) { return displayStatus(s) === "stalled"; }).length;
    if (!n) { el.innerHTML = ""; return; }
    el.innerHTML = '<div class="banner"><span>' + n +
      (n === 1 ? " onboarding session is" : " onboarding sessions are") +
      ' stalled (no activity for 48h+).</span>' +
      '<button type="button" id="stalledView">View stalled</button></div>';
    $("stalledView").addEventListener("click", function () {
      FILTER.status = ["stalled"];
      renderFilters();
      renderTable();
    });
  }

  function render(sessions) {
    SESSIONS = sessions;
    snapshotSessions(sessions);            // baseline for the background "new activity" nudge
    var ub = $("updateBanner"); if (ub) ub.innerHTML = ""; // just loaded, so we're current
    renderStalledBanner(); // Feature 5: recompute across all sessions on every reload
    $("count").textContent = sessions.length + (sessions.length === 1 ? " session" : " sessions");
    if (!sessions.length) {
      $("kpis").hidden = true; $("filters").hidden = true; $("insightsWrap").hidden = true;
      $("activeFilters").innerHTML = "";
      $("body").innerHTML = '<div style="text-align:center;padding:56px 20px;color:var(--muted)">' +
        '<div style="font-size:34px;opacity:.5;margin-bottom:10px">📥</div>' +
        '<div style="font-size:15px;font-weight:700;color:var(--teal);margin-bottom:4px">No onboarding sessions yet</div>' +
        '<div style="font-size:13px;line-height:1.5">Sessions appear here the moment a client sends their brief.</div></div>';
      return;
    }
    renderFilters();
    renderTable(); // renderTable recomputes the KPIs from the filtered list
  }

  // Close from anywhere (button, backdrop, Escape) and hand focus back to where
  // the user was — a Proserv user triages many sessions in a row.
  var lastFocus = null;
  // Monotonic token so a slow fetch for a previously-opened (or since-closed) session
  // can't repaint the modal with the wrong client's brief. Each open captures the
  // current value; a resolve whose token is stale is ignored. Closing bumps it.
  var _openSeq = 0;
  function closeModal() {
    _openSeq++;
    $("modal").classList.remove("show");
    if (lastFocus && lastFocus.focus) { try { lastFocus.focus(); } catch (e) {} }
    lastFocus = null;
  }

  function openSession(id) {
    var myReq = ++_openSeq;
    lastFocus = document.activeElement;
    $("sheet").innerHTML = '<div class="empty">Loading…</div>';
    $("modal").classList.add("show");
    $("sheet").focus();
    authedFetch(SESSION_ENDPOINT + "?id=" + encodeURIComponent(id))
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(function (data) { if (myReq !== _openSeq) return; renderSheet(data.session); loadSeedNotes(data.session); })
      .catch(function (e) { if (myReq !== _openSeq) return; $("sheet").innerHTML = '<div class="err">Could not open session (' + esc(e.message) + ').</div>'; });
  }

  // Consultant notes live in the seed store, not the session record, and are
  // returned only to a token-authenticated caller. Fetch them separately.
  function loadSeedNotes(s) {
    if (!s || !s.seedId) return;
    var el = $("seedNotes"); if (!el) return;
    authedFetch(SEED_ENDPOINT + "?id=" + encodeURIComponent(s.seedId))
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        var notes = d && d.seed && d.seed.notes;
        el.innerHTML = notes ? '<div style="white-space:pre-wrap">' + esc(notes) + '</div>' : '<div class="muted">No notes.</div>';
      })
      .catch(function () { el.innerHTML = '<div class="muted">Could not load notes.</div>'; });
  }

  function renderSheet(s) {
    var c = (s.merged && s.merged.company) || {};
    var topics = (s.merged && Array.isArray(s.merged.topics)) ? s.merged.topics : [];
    var channels = (s.merged && Array.isArray(s.merged.channels)) ? s.merged.channels : [];
    var users = Array.isArray(s.users) ? s.users : [];
    var html = '<div class="sheethead"><button class="close" id="close">Close</button>' +
      '<h2>' + esc(c.name || "(unnamed)") + '</h2>' +
      '<div class="sub">' + esc(c.contact || "") + (c.email ? " · " + esc(c.email) : "") + '</div>' +
      // Chase actions live here too, not only in the table row. Opening a stalled
      // client to read what they captured is exactly when you decide to nudge them,
      // and previously that meant closing the modal, finding the row again and
      // scrolling right to reach the buttons.
      ((displayStatus(s) === "stalled" || displayStatus(s) === "link_sent") && s.seedId
        ? '<div class="chase">' +
            '<button type="button" class="copylink" data-copy="' + esc(clientLink(s.seedId)) + '">Copy link</button>' +
            (s.email ? '<button type="button" class="remind" id="detailRemind">Send reminder</button>' : "") +
          '</div>'
        : "") +
      '<div class="stabs"><button type="button" data-sec="topics">Topics</button><button type="button" data-sec="channels">Channels</button><button type="button" data-sec="users">Users</button></div></div>' +
      '<div class="sheetbody"><div class="kv">' +
        kv("Industry", c.industry) +
        kv("Markets", c.markets) +
        kv("Languages", c.languages) +
        kv("Objectives", c.objectives) +
        kv("Teams", c.teams) +
        kv("Timezone", c.timezone) +
        kv("Time spent", fmtDuration(s.durationMs)) +
        kv("AI calls", s.apiCalls != null ? s.apiCalls : "—") +
        kv("Tokens", s.tokens ? (fmtTokens(totalTokens(s.tokens)) + " — " + num(s.tokens.input) + " in / " + num(s.tokens.output) + " out / " + num(s.tokens.cacheRead) + " cached-read") : "—") +
        kv("Est. cost", s.tokens ? fmtCost(costOf(s.tokens)) : "—") +
        kv("Submitted", fmtDate(s.sentAt)) +
      '</div>';

    if (c.objectiveDetails) html += '<div class="sec">Objective details</div><div class="list"><div>' + esc(c.objectiveDetails) + '</div></div>';

    html += '<div class="sec" id="sec-topics">Topics to track (' + topics.length + ')</div><div class="list">' +
      (topics.length ? topics.map(function (t) {
        return '<div><strong>' + esc(t.name) + '</strong>' + (t.keywords ? ' — ' + esc(t.keywords) : "") + (t.rationale ? ' <span class="muted">(' + esc(t.rationale) + ')</span>' : "") + '</div>';
      }).join("") : '<div class="muted">None</div>') + '</div>';

    html += '<div class="sec" id="sec-channels">Channels (' + channels.length + ')</div><div class="list">' +
      (channels.length ? channels.map(function (ch) {
        return '<div>' + esc(ch.author || ch.url || "") + (ch.type ? ' <span class="muted">' + esc(ch.type) + '</span>' : "") + '</div>';
      }).join("") : '<div class="muted">None</div>') + '</div>';

    html += '<div class="sec" id="sec-users">Users (' + users.length + ')</div><div class="list">' +
      (users.length ? users.map(function (u) {
        return '<div>' + esc((u.firstName || "") + " " + (u.lastName || "")) + ' <span class="muted">' + esc(u.email || "") + (u.role ? " · " + esc(u.role) : "") + '</span></div>';
      }).join("") : '<div class="muted">None</div>') + '</div>';

    if (s.queries && s.queries !== "__skip__") {
      html += '<div class="sec">Migrated queries</div><div class="qbox">' + esc(s.queries) + '</div>';
    }

    var sUrl = safeUrl(s.sheetUrl);
    if (sUrl) html += '<div class="sec">Editable Google Sheet</div><div class="list"><div><a href="' + esc(sUrl) + '" target="_blank" rel="noopener noreferrer">Open the client\'s brief in Google Sheets</a></div></div>';

    var h = s.handoff;
    var handoffText = ""; // Feature 6: plain-text version for the Copy button
    if (h) {
      var hpairs = [["Maturity", h.maturity], ["Goal in their words", h.goalInOwnWords], ["Hesitations", h.hesitations], ["AI-suggested, unconfirmed", h.aiSuggestedUnconfirmed], ["Follow-ups for the review call", h.followUps], ["Tips for the consultant", h.consultantTips]]
        .filter(function (r) { return r[1]; });
      var hrows = hpairs.map(function (r) { return '<div><strong>' + esc(r[0]) + ':</strong> ' + esc(r[1]) + '</div>'; }).join("");
      if (hrows) {
        handoffText = hpairs.map(function (r) { return r[0] + ": " + r[1]; }).join("\n");
        html += '<div class="sec">Consultant handoff <button type="button" id="copyHandoff" class="copybtn">Copy handoff</button></div><div class="list">' + hrows + '</div>';
      }
    }

    if (s.seedId) {
      html += '<div class="sec">Consultant notes (from Sales)</div><div class="list" id="seedNotes"><div class="muted">Loading…</div></div>';
    }

    html += '</div>'; // close .sheetbody
    $("sheet").innerHTML = html;
    $("close").addEventListener("click", closeModal);
    $("close").focus();
    // Wire the detail-header chase actions. The table's delegated handlers don't reach
    // inside the modal, so these are bound here against the session already in scope.
    var dRemind = document.getElementById("detailRemind");
    if (dRemind) dRemind.addEventListener("click", function () { openReminderDraft(s); });
    Array.prototype.forEach.call(document.querySelectorAll(".chase .copylink"), function (b) {
      b.addEventListener("click", function () { copyText(b.getAttribute("data-copy"), b, "Copy link"); });
    });
    // E4: jump-to-section tabs scroll the modal to Topics / Channels / Users.
    Array.prototype.forEach.call(document.querySelectorAll(".stabs button"), function (b) {
      b.addEventListener("click", function () {
        var el = document.getElementById("sec-" + b.getAttribute("data-sec"));
        if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
      });
    });
    // Feature 6: copy the handoff rows as plain text (only present when there is a handoff).
    var copyBtn = $("copyHandoff");
    if (copyBtn) {
      var copyLabel = copyBtn.textContent;
      copyBtn.addEventListener("click", function () { copyText(handoffText, copyBtn, copyLabel); });
    }
  }

  // Feature 6: copy helper. Prefer the async Clipboard API; fall back to a hidden
  // textarea + execCommand for older or non-secure contexts. Shows a transient
  // "Copied" on the button.
  function copyText(text, btn, label) {
    function done() {
      if (!btn) return;
      btn.textContent = "Copied";
      setTimeout(function () { btn.textContent = label; }, 1500);
    }
    function fallback() {
      try {
        var ta = document.createElement("textarea");
        ta.value = text;
        ta.style.position = "fixed";
        ta.style.top = "-1000px";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
        done();
      } catch (e) { /* clipboard unavailable */ }
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, fallback);
    } else {
      fallback();
    }
  }

  function kv(k, v) {
    if (!v) return "";
    return '<div class="k">' + esc(k) + '</div><div>' + esc(v) + '</div>';
  }

  $("modal").addEventListener("click", function (e) { if (e.target === $("modal")) closeModal(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && $("modal").classList.contains("show")) closeModal(); });
  // Keep Tab inside the dialog while it is open. aria-modal="true" tells assistive tech
  // the rest of the page is inert, but it does NOT change the browser's tab order: the
  // page behind is still fully focusable, so tabbing past the last control walked the
  // keyboard silently out of the dialog and into a table the user could no longer see.
  var FOCUSABLE = 'a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])';
  document.addEventListener("keydown", function (e) {
    if (e.key !== "Tab" || !$("modal").classList.contains("show")) return;
    var sheet = $("sheet");
    // Only elements actually rendered: the brief hides sections that have no content,
    // and a zero-size control must not become an invisible tab stop.
    var nodes = Array.prototype.filter.call(sheet.querySelectorAll(FOCUSABLE), function (n) {
      return n.offsetWidth > 0 || n.offsetHeight > 0;
    });
    if (!nodes.length) { e.preventDefault(); sheet.focus(); return; }
    var first = nodes[0], last = nodes[nodes.length - 1], here = document.activeElement;
    // Focus sitting outside the sheet (or on the sheet itself) means we are entering:
    // send it to whichever end the direction implies rather than letting it escape.
    if (!sheet.contains(here) || here === sheet) { e.preventDefault(); (e.shiftKey ? last : first).focus(); return; }
    if (e.shiftKey && here === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && here === last) { e.preventDefault(); first.focus(); }
  });
  $("refresh").addEventListener("click", load);
  $("insToggle").addEventListener("click", function () {
    var hidden = $("insights").classList.toggle("hidden");
    this.textContent = hidden ? "Show" : "Hide";
    try { localStorage.setItem("dash_insights_hidden", hidden ? "1" : "0"); } catch (e) {}
  });
  // Insights starts COLLAPSED (both in the markup above and here): the session table
  // is what a consultant opens this page for, and the charts pushed it below the fold
  // on a laptop screen. Only an explicit "keep it open" choice ("0") expands it, and
  // that choice persists. renderInsights never touches the .hidden class, so this sticks.
  try {
    if (localStorage.getItem("dash_insights_hidden") === "0") {
      $("insights").classList.remove("hidden");
      $("insToggle").textContent = "Hide";
    }
  } catch (e) {}

  // Click (or Enter/Space) a breakdown bar to filter the whole dashboard to that
  // package / language / consultant; clicking the active one clears it. Delegated on
  // #insights, which persists across chart re-renders.
  function applyChartFilter(fk, fv) {
    if (!fk) return;
    FILTER[fk] = (String(FILTER[fk]) === String(fv)) ? "all" : fv;
    renderFilters();
    renderTable();
  }
  function chartRowFrom(e) { return (e.target && e.target.closest) ? e.target.closest(".barrow-click") : null; }
  $("insights").addEventListener("click", function (e) {
    var row = chartRowFrom(e);
    if (row) applyChartFilter(row.getAttribute("data-fk"), row.getAttribute("data-fv"));
  });
  $("insights").addEventListener("keydown", function (e) {
    if (e.key !== "Enter" && e.key !== " " && e.key !== "Spacebar") return;
    var row = chartRowFrom(e);
    if (row) { e.preventDefault(); applyChartFilter(row.getAttribute("data-fk"), row.getAttribute("data-fv")); }
  });
  // Active-filter chips: click a chip's × to remove just that filter, or "Clear all".
  $("activeFilters").addEventListener("click", function (e) {
    var b = (e.target && e.target.closest) ? e.target.closest("[data-clear]") : null;
    if (b) clearFilter(b.getAttribute("data-clear"));
  });
  // Resolve the Google gate BEFORE the first read. Loading first would fire a
  // request that is guaranteed to 401, and pop the token card up behind the
  // sign-in card — two stacked prompts, the wrong one on top. When the gate is
  // configured, load() is deferred until the credential arrives
  // (onGoogleCredential); when it is not, this resolves false and nothing about
  // the existing flow changes.
  // Three outcomes, not two:
  //   "unlocked" - gate is on but a still-valid token was reused, so go straight in
  //   true       - gate is on and waiting for a sign-in; load() runs from onUnlock
  //   false      - gate not configured for this site; behave exactly as before
  initGoogleGate().then(function (gate) {
    if (gate === "unlocked") { load(); return; }
    if (gate) { _gPending = true; return; }
    load();
  });
  setInterval(pollUpdates, UPDATE_POLL_MS); // background check for new activity
</script>
</body>
</html>
